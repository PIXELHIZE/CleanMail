name: CleanMail CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install development dependencies
        run: npm ci
      - name: Test Node and Worker runtimes
        run: npm test
      - name: Validate Worker bundle
        run: npm run build:worker
